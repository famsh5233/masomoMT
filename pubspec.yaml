name: masomo
description: "Masomo Speak: practise speaking English with an AI teacher that explains in your language."
publish_to: 'none'

# Build number must be higher than any version already uploaded to Google Play (old app: 9).
version: 2.0.0+20

environment:
  sdk: ^3.13.4

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  http: ^1.6.0
  in_app_purchase: ^3.3.1
  provider: ^6.1.5+1
  speech_to_text: ^7.5.0
  url_launcher: ^6.3.2
  video_player: ^2.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/masomo.png
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
